<script>
/* =====================================================================
 * Krusning – lyd
 * ---------------------------------------------------------------------
 * All lyd lages i sanntid med Web Audio (ingen lydfiler å holde styr på).
 * Toner hentes fra en pentatonisk skala, så alt låter pent sammen.
 * Merk: på iPhone er lyden av når lydløs-bryteren er på.
 * ===================================================================== */
(function (root) {
  'use strict';

  const PENTA = [0, 2, 4, 7, 9];
  const midi = (n) => 440 * Math.pow(2, (n - 69) / 12);
  const note = (i, base) => { // i-te tone i skalaen fra grunntonen
    const o = Math.floor(i / 5), d = ((i % 5) + 5) % 5;
    return midi((base || 72) + o * 12 + PENTA[d]);
  };

  const S = {
    ctx: null, master: null, sfxBus: null, musicBus: null, verb: null,
    sfxOn: true, musicOn: true,
    musicTimer: null, nextChordAt: 0, nextNoteAt: 0, chordIdx: 0,
  };

  S.unlock = function () {
    if (!S.ctx) {
      const AC = root.AudioContext || root.webkitAudioContext;
      if (!AC) return;
      try { S.ctx = new AC(); } catch (e) { return; }
      const ctx = S.ctx;
      S.master = ctx.createGain(); S.master.gain.value = 0.9;
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 4;
      S.master.connect(comp); comp.connect(ctx.destination);
      S.verb = ctx.createConvolver();
      S.verb.buffer = impulse(ctx, 2.4, 2.8);
      const wet = ctx.createGain(); wet.gain.value = 0.32;
      S.verb.connect(wet); wet.connect(S.master);
      S.sfxBus = ctx.createGain(); S.sfxBus.gain.value = S.sfxOn ? 1 : 0;
      S.sfxBus.connect(S.master);
      S.musicBus = ctx.createGain(); S.musicBus.gain.value = S.musicOn ? 0.55 : 0;
      S.musicBus.connect(S.master);
      // en stille lyd "låser opp" lyden på iOS
      const b = ctx.createBuffer(1, 1, 22050);
      const src = ctx.createBufferSource(); src.buffer = b; src.connect(ctx.destination); src.start(0);
    }
    if (S.ctx.state === 'suspended') S.ctx.resume();
    if (S.musicOn) S.startMusic();
  };

  function impulse(ctx, seconds, decay) {
    const rate = ctx.sampleRate, len = Math.floor(rate * seconds);
    const buf = ctx.createBuffer(2, len, rate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }

  S.setSfx = function (on) {
    S.sfxOn = on;
    if (S.sfxBus) S.sfxBus.gain.setTargetAtTime(on ? 1 : 0, S.ctx.currentTime, 0.05);
  };
  S.setMusic = function (on) {
    S.musicOn = on;
    if (S.musicBus) S.musicBus.gain.setTargetAtTime(on ? 0.55 : 0, S.ctx.currentTime, 0.3);
    if (on && S.ctx) S.startMusic();
  };

  const ready = () => S.ctx && S.ctx.state === 'running';

  // En enkel tone med konvolutt. send = andel til romklang.
  function tone(o) {
    const ctx = S.ctx, t = o.t || ctx.currentTime;
    const osc = ctx.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t + (o.glide || o.dur));
    const g = ctx.createGain();
    const a = o.attack || 0.004;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.vol || 0.2, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + o.dur);
    osc.connect(g);
    g.connect(o.bus || S.sfxBus);
    if (o.send) { const s = ctx.createGain(); s.gain.value = o.send; g.connect(s); s.connect(S.verb); }
    osc.start(t); osc.stop(t + a + o.dur + 0.05);
  }

  function noise(o) {
    const ctx = S.ctx, t = o.t || ctx.currentTime;
    const len = Math.floor(ctx.sampleRate * (o.dur + 0.02));
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = o.filter || 'bandpass';
    f.frequency.value = o.freq || 2000; f.Q.value = o.q || 1;
    const g = ctx.createGain();
    g.gain.setValueAtTime(o.vol || 0.1, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    src.connect(f); f.connect(g); g.connect(S.sfxBus);
    if (o.send) { const s = ctx.createGain(); s.gain.value = o.send; g.connect(s); s.connect(S.verb); }
    src.start(t); src.stop(t + o.dur + 0.02);
  }

  /* ---------- lydeffekter ---------- */

  // Vanndråpe. x (0..1) velger tone: venstre dypt, høyre lyst.
  S.plip = function (x) {
    if (!ready()) return;
    const i = Math.max(0, Math.min(9, Math.round(x * 9)));
    const f = note(i, 67);
    tone({ f: f * 0.7, f2: f * 1.5, glide: 0.07, dur: 0.16, vol: 0.28, send: 0.45 });
    tone({ f: f * 2, dur: 0.06, vol: 0.05, type: 'triangle', send: 0.3 });
    noise({ dur: 0.07, freq: 3200, q: 0.8, vol: 0.05, filter: 'highpass' });
  };

  // Regndråpe: myk, lys dråpe (svakere enn et trykk).
  S.drop = function (x) {
    if (!ready()) return;
    const f = note(5 + Math.round(x * 4), 72);
    tone({ f: f * 0.8, f2: f * 1.4, glide: 0.05, dur: 0.1, vol: 0.09, send: 0.5 });
    noise({ dur: 0.04, freq: 4200, q: 0.8, vol: 0.025, filter: 'highpass' });
  };
  // Tidevannet skifter: et mykt sus.
  S.tide = function () {
    if (!ready()) return;
    noise({ dur: 0.7, freq: 600, q: 0.6, vol: 0.05 });
    tone({ f: 110, f2: 90, glide: 0.5, dur: 0.6, vol: 0.04, send: 0.6 });
  };
  // Frosk som hopper: lite «kvekk».
  S.frog = function () {
    if (!ready()) return;
    const t = S.ctx.currentTime;
    tone({ f: 260, f2: 190, dur: 0.07, vol: 0.12, type: 'square', t });
    tone({ f: 300, f2: 210, dur: 0.08, vol: 0.1, type: 'square', t: t + 0.09 });
  };
  // Frosken lander: «plopp».
  S.land = function () {
    if (!ready()) return;
    tone({ f: 140, f2: 420, glide: 0.06, dur: 0.12, vol: 0.2, send: 0.35 });
  };
  // Bryter og sluseport: klikk og en dyp rumling.
  S.gate = function () {
    if (!ready()) return;
    const t = S.ctx.currentTime;
    tone({ f: 880, dur: 0.05, vol: 0.12, type: 'triangle', t });
    tone({ f: 1320, dur: 0.06, vol: 0.08, type: 'triangle', t: t + 0.06 });
    tone({ f: 90, f2: 60, dur: 0.6, vol: 0.18, type: 'triangle', t: t + 0.1, send: 0.3 });
    noise({ dur: 0.5, freq: 400, q: 0.6, vol: 0.05, t: t + 0.1 });
  };

  S.hit = function (f) {
    if (!ready() || f < 0.25) return;
    tone({ f: 180 + f * 120, f2: 320 + f * 200, glide: 0.08, dur: 0.12, vol: 0.05 * f, send: 0.3 });
  };

  S.bump = function (v, what) {
    if (!ready()) return;
    const k = Math.min(1, v / 320);
    if (k < 0.08) return;
    if (what === 'rock' || what === 'shore' || what === 'sand') {
      tone({ f: 150, f2: 90, dur: 0.09, vol: 0.22 * k, type: 'triangle' });
      noise({ dur: 0.05, freq: 900, q: 1.2, vol: 0.12 * k });
    } else if (what === 'log') {
      tone({ f: 210, f2: 160, dur: 0.1, vol: 0.22 * k, type: 'triangle' });
      tone({ f: 420, dur: 0.05, vol: 0.06 * k });
    } else if (what === 'pad') {
      tone({ f: 120, f2: 80, dur: 0.12, vol: 0.18 * k });
    } else { // båt mot båt: papir mot papir
      tone({ f: 330, f2: 250, dur: 0.07, vol: 0.14 * k, type: 'triangle' });
      noise({ dur: 0.05, freq: 2500, q: 0.7, vol: 0.06 * k });
    }
  };

  // Klokkespill når en båt kommer i havn. Stiger for hver båt.
  S.dock = function (n) {
    if (!ready()) return;
    const f = note(4 + n * 2, 72);
    const t = S.ctx.currentTime;
    tone({ f, dur: 0.9, vol: 0.2, send: 0.6, t });
    tone({ f: f * 2.76, dur: 0.25, vol: 0.05, send: 0.5, t });
    tone({ f: f * 1.5, dur: 0.6, vol: 0.07, send: 0.6, t: t + 0.07 });
  };

  S.win = function () {
    if (!ready()) return;
    const t = S.ctx.currentTime;
    [0, 2, 4, 5, 7].forEach((d, i) => {
      const f = note(d, 72);
      tone({ f, dur: 0.55, vol: 0.16, send: 0.55, t: t + i * 0.09 });
      tone({ f: f * 4, dur: 0.12, vol: 0.03, send: 0.4, t: t + i * 0.09 });
    });
    tone({ f: note(0, 48), dur: 1.6, vol: 0.08, attack: 0.08, type: 'triangle', send: 0.5, t });
  };

  S.star = function (i) {
    if (!ready()) return;
    const f = note(5 + i * 2, 72);
    tone({ f, dur: 0.5, vol: 0.18, send: 0.5 });
    tone({ f: f * 2, dur: 0.18, vol: 0.05, send: 0.5 });
  };

  S.pearl = function () {
    if (!ready()) return;
    const t = S.ctx.currentTime;
    for (let i = 0; i < 7; i++) {
      const f = note(8 + i, 72);
      tone({ f, dur: 0.6, vol: 0.09, send: 0.8, t: t + i * 0.055 });
    }
  };

  S.sink = function () {
    if (!ready()) return;
    const t = S.ctx.currentTime;
    tone({ f: 520, f2: 110, glide: 0.9, dur: 0.95, vol: 0.14, send: 0.4, t });
    for (let i = 0; i < 4; i++) tone({ f: 300 + Math.random() * 300, f2: 700, glide: 0.05, dur: 0.06, vol: 0.06, t: t + 0.15 + i * 0.16 });
  };

  // Båt går utfor en foss: et lite "plopp" nedover og sprut.
  S.fall = function () {
    if (!ready()) return;
    tone({ f: 640, f2: 260, glide: 0.18, dur: 0.22, vol: 0.12, send: 0.5 });
    noise({ dur: 0.18, freq: 1800, q: 0.6, vol: 0.09 });
  };

  // Båt krasjer i en foss ovenfra: brus og en kort, lav tone.
  S.crash = function () {
    if (!ready()) return;
    noise({ dur: 0.45, freq: 1400, q: 0.5, vol: 0.16 });
    tone({ f: 200, f2: 90, glide: 0.3, dur: 0.35, vol: 0.12, type: 'triangle' });
  };

  S.pop = function () {
    if (!ready()) return;
    tone({ f: 300, f2: 900, glide: 0.08, dur: 0.12, vol: 0.14, send: 0.4 });
  };

  S.click = function () {
    if (!ready()) return;
    tone({ f: 1100, f2: 1500, glide: 0.03, dur: 0.05, vol: 0.06 });
  };

  S.lose = function () { // stjerne mistet (diskret)
    if (!ready()) return;
    tone({ f: 520, f2: 390, glide: 0.15, dur: 0.18, vol: 0.06, type: 'triangle' });
  };

  /* ---------- rolig bakgrunnsmusikk (generert) ---------- */

  const CHORDS = [
    [48, 55, 64, 71], // Cmaj7
    [45, 52, 60, 67], // Am7
    [41, 48, 57, 64], // Fmaj7
    [43, 50, 59, 64], // G6
  ];

  S.startMusic = function () {
    if (!S.ctx || S.musicTimer) return;
    S.nextChordAt = S.ctx.currentTime + 0.3;
    S.nextNoteAt = S.ctx.currentTime + 1.2;
    S.musicTimer = setInterval(scheduleMusic, 200);
  };
  S.stopMusic = function () { clearInterval(S.musicTimer); S.musicTimer = null; };

  function scheduleMusic() {
    if (!S.ctx || S.ctx.state !== 'running') return;
    const now = S.ctx.currentTime, ahead = now + 0.5;
    while (S.nextChordAt < ahead) {
      const ch = CHORDS[S.chordIdx % CHORDS.length];
      S.chordIdx++;
      ch.forEach((n, i) => {
        tone({ f: midi(n), dur: 5.2, vol: i === 0 ? 0.045 : 0.03, attack: 1.4, type: i === 0 ? 'sine' : 'triangle', bus: S.musicBus, send: 0.7, t: S.nextChordAt });
      });
      S.nextChordAt += 6;
    }
    while (S.nextNoteAt < ahead) {
      const ch = CHORDS[(S.chordIdx + CHORDS.length - 1) % CHORDS.length];
      const n = ch[1 + Math.floor(Math.random() * 3)] + 24;
      tone({ f: midi(n), dur: 1.1, vol: 0.035, bus: S.musicBus, send: 0.85, t: S.nextNoteAt });
      tone({ f: midi(n) * 3, dur: 0.15, vol: 0.006, bus: S.musicBus, send: 0.6, t: S.nextNoteAt });
      S.nextNoteAt += 0.6 + Math.random() * 1.6;
    }
  }

  root.Sound = S;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* =====================================================================
 * Krusning – spillets hovedfil
 * ---------------------------------------------------------------------
 * Binder sammen fysikk (engine.js), tegning (render.js), lyd (audio.js),
 * baner (levels.js) og tekster (strings.js). Her ligger:
 *   • skjermene: tittel, banekart, spill, resultat, innstillinger
 *   • trykk: hold for å sikte, slipp for å lage krusning
 *   • stjerner, perler, rekorder og lagring (kun på enheten)
 *   • effekter: sprut, kjølvann, gnister, fisk og blader
 *   • hint som regnes ut direkte fra situasjonen
 * ===================================================================== */
(function () {
  'use strict';
  const E = window.Engine, R = window.Render, S = window.Sound, I = window.I18N, LV = window.Levels;
  const C = E.C;
  const TAU = Math.PI * 2;
  const $ = (id) => document.getElementById(id);
  // MIDLERTIDIG: «Test: velg bane» på tittelskjermen hopper til hvilken som
  // helst bane, også låste. Sett til false før lansering.
  const DEV_JUMP = true;
  const t = (k, v) => I.t(k, v);

  /* ---------- lagring (localStorage – bare på denne enheten) ---------- */
  // Versjon 2 (nov. 2026): la til Rask runde (quick) og Dagens dam (daily).
  // Fremgang fra versjon 1 hentes automatisk inn første gang.
  const SAVE_KEY = 'krusning.save.v2';
  const OLD_KEY = 'krusning.save.v1';
  const TIERS = ['easy', 'medium', 'hard'];
  function quickDefaults() {
    const q = {};
    for (const tr of TIERS) q[tr] = { i: 0, played: 0, three: 0, pearls: 0, streak: 0, best: 0 };
    return q;
  }
  // stryk: rekorder i Stryket (elvestryk), lagt til nov. 2026 uten ny versjon
  // fordi gamle lagringer bare mangler feltet.
  function defaults() { return { v: 2, lang: 'no', sfx: true, music: true, light: false, levels: {}, last: null, quick: quickDefaults(), daily: {}, stryk: {} }; }
  function upgrade(s) {
    const out = Object.assign(defaults(), s, { v: 2 });
    out.quick = quickDefaults();
    for (const tr of TIERS) Object.assign(out.quick[tr], (s.quick && s.quick[tr]) || {});
    out.daily = s.daily || {};
    out.levels = s.levels || {};
    out.stryk = s.stryk || {};
    return out;
  }
  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) { const s = JSON.parse(raw); if (s && s.v === 2) return upgrade(s); }
      const old = localStorage.getItem(OLD_KEY);
      if (old) { const s = JSON.parse(old); if (s && s.v === 1) return upgrade(s); }
    } catch (e) { /* privat modus e.l. – spill uten lagring */ }
    return defaults();
  }
  let save = load();
  function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* ignorer */ } }

  /* ---------- baner og fremgang ---------- */
  const ALL = [];
  LV.WORLDS.forEach((w, wi) => (w.levels || []).forEach((lv, li) => ALL.push({ lv, w, wi, li, idx: ALL.length })));
  const byId = (id) => ALL.find((e) => e.lv.id === id);
  const rec = (id) => save.levels[id];

  function thresholds(lv) { return [lv.par, lv.par + Math.max(1, Math.round(lv.par * 0.5))]; }
  function starsFor(lv, taps) { const [a, b] = thresholds(lv); return taps <= a ? 3 : taps <= b ? 2 : 1; }
  function totalStars() { let n = 0; for (const k in save.levels) n += save.levels[k].stars || 0; return n; }
  function totalPearls() { let n = 0; for (const k in save.levels) if (save.levels[k].pearl) n++; return n; }
  // En verden åpnes med nok stjerner, og når finalen i verdenen før er klart.
  function prevFinale(w) {
    const i = LV.WORLDS.indexOf(w);
    for (let k = i - 1; k >= 0; k--) {
      const lv = LV.WORLDS[k].levels;
      if (lv && lv.length) return lv[lv.length - 1];
    }
    return null;
  }
  function worldOpen(w) {
    if (w.soon) return false;
    const fin = prevFinale(w);
    if (fin && !w.unlockPearls && !rec(fin.id)) return false;
    return totalStars() >= (w.unlockStars || 0) && totalPearls() >= (w.unlockPearls || 0);
  }
  function levelOpen(e) {
    if (rec(e.lv.id)) return true;
    if (!worldOpen(e.w)) return false;
    if (e.li === 0) return true;
    return !!rec(e.w.levels[e.li - 1].id);
  }
  function nextToPlay() {
    for (const e of ALL) if (levelOpen(e) && !rec(e.lv.id)) return e;
    return (save.last && byId(save.last)) || ALL[0];
  }
  const anyProgress = () => Object.keys(save.levels).length > 0;

  /* ---------- tilstand ---------- */
  const G = {
    screen: 'title',
    entry: null, world: null, titleWorld: null,
    acc: 0, time: 0, last: 0,
    aim: null, rect: null,
    particles: [], fish: [], leaves: [],
    boatFx: {}, dockFx: {}, look: null,
    completed: false, winAt: -1, result: null,
    hint: null, hintToken: 0, hintBusy: false, hintUsed: false,
    shownStars: 3, handOn: false, tipOn: false,
    mapWorld: 0, nextAmbient: 3,
    sk: null, skI: 0, skFx: null, // Stryket
  };

  // Dammen bak tittelskjermen: noen båter å leke med.
  const TITLE_LEVEL = {
    id: 'title',
    boats: [{ x: 92, y: 300, angle: -0.5 }, { x: 262, y: 262, angle: 3.5 }, { x: 178, y: 392, angle: -1.9, color: 2 }],
    pads: [{ x: 66, y: 450, r: 22, flower: true }, { x: 300, y: 405, r: 18 }],
    rocks: [{ x: 296, y: 136, r: 19 }],
    docks: [],
  };

  /* ---------- skjermer ---------- */
  const canvas = $('game');

  function setScreen(name) {
    G.screen = name;
    $('title').hidden = name !== 'title';
    $('map').hidden = name !== 'map';
    $('hud').hidden = name !== 'play' && name !== 'stryk';
    $('hud').classList.toggle('stryk', name === 'stryk');
    $('hudProg').hidden = $('hudPearls').hidden = name !== 'stryk';
    $('win').hidden = true;
    if (name !== 'play' && name !== 'stryk') { hideTip(true); hideHand(); $('banner').hidden = true; G.aim = null; G.hint = null; }
  }

  function transition(fn) {
    const f = $('fade');
    f.classList.add('on');
    setTimeout(() => { fn(); requestAnimationFrame(() => f.classList.remove('on')); }, 220);
  }

  function toTitle() {
    G.world = G.titleWorld;
    G.entry = null;
    spawnDecor('title');
    setBoatFx(G.world);
    setScreen('title');
    applyTexts();
  }

  /* ---------- bane ---------- */
  function startLevel(entry, quick) {
    G.entry = entry;
    if (!entry.mode) { save.last = entry.lv.id; persist(); }
    G.world = E.createWorld(entry.lv);
    G.acc = 0; G.particles = []; G.dockFx = {}; G.look = null;
    G.completed = false; G.winAt = -1; G.result = null;
    G.hint = null; G.hintToken++; G.hintUsed = false; G.hintBusy = false;
    $('btnHint').classList.remove('busy');
    G.shownStars = 3;
    setBoatFx(G.world);
    spawnDecor(entry.lv.id);
    setScreen('play');
    updateHud(true);
    if (!quick) showBanner(entry.lv);
    showTip(entry.lv, quick ? 150 : 900);
    G.handOn = !!entry.lv.hand && !rec(entry.lv.id);
    $('hand').hidden = !G.handOn;
  }

  function restart() {
    if (!G.entry) return;
    S.click();
    startLevel(G.entry, true);
    for (const b of G.world.boats) { const f = G.boatFx[b.id]; if (f) f.pop = 1; }
  }

  function setBoatFx(w) {
    G.boatFx = {};
    const colored = w.docks.some((d) => d.color >= 0);
    for (const b of w.boats) b.mark = colored;
    for (const b of w.boats) G.boatFx[b.id] = { squash: 0, blink: 0, nextBlink: 1 + Math.random() * 3, angle: b.angle, pop: 0, wake: 0 };
  }

  /* ---------- trykk ---------- */
  function toWorld(e) {
    const r = G.rect || canvas.getBoundingClientRect();
    return R.toWorld(e.clientX - r.left, e.clientY - r.top);
  }

  canvas.addEventListener('pointerdown', (e) => {
    S.unlock();
    const p = toWorld(e);
    if (G.screen === 'stryk') {
      // trykk hvor som helst på vannet (elva går over hele skjermen)
      if (G.sk && !G.completed) {
        const d = G.sk.dist + (SK.K.BOAT_Y - p.y);
        if (p.x > SK.bankL(G.sk.lv, d) - 8 && p.x < SK.bankR(G.sk.lv, d) + 8) SK.tap(G.sk, p.x, p.y);
      }
      e.preventDefault();
      return;
    }
    if (G.screen === 'title') {
      if (E.insidePond(p.x, p.y, 2)) E.tap(G.world, p.x, p.y);
      return;
    }
    if (G.screen !== 'play' || G.completed || !E.insidePond(p.x, p.y, 2)) return;
    G.aim = { x: p.x, y: p.y, cancel: !E.canTap(G.world, p.x, p.y), id: e.pointerId };
    hideHand();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ok */ }
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!G.aim || e.pointerId !== G.aim.id) return;
    const p = toWorld(e);
    G.aim.x = p.x; G.aim.y = p.y;
    G.aim.cancel = !E.canTap(G.world, p.x, p.y);
  });
  canvas.addEventListener('pointerup', (e) => {
    if (!G.aim || e.pointerId !== G.aim.id) return;
    const a = G.aim; G.aim = null;
    if (!a.cancel) playerTap(a.x, a.y);
  });
  canvas.addEventListener('pointercancel', () => { G.aim = null; });
  // hindre zoom/rulling på iOS
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('touchmove', (e) => { if (e.target === canvas) e.preventDefault(); }, { passive: false });

  function playerTap(x, y) {
    if (!G.world || G.completed) return;
    if (!E.tap(G.world, x, y)) return;
    G.hintToken++;
    if (G.hintBusy) { G.hintBusy = false; $('btnHint').classList.remove('busy'); }
    G.hint = null;
    hideHand();
    hideTip();
  }

  /* ---------- hovedløkke ---------- */
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - G.last) / 1000));
    G.last = now; G.time += dt;
    if (G.world) {
      G.acc += dt;
      let n = 0;
      while (G.acc >= C.DT && n < 10) {
        E.step(G.world);
        G.acc -= C.DT; n++;
        if (G.world.events.length) handleEvents();
      }
      if (n >= 10) G.acc = 0;
    }
    if (G.screen === 'stryk' && G.sk) strykFrame(dt);
    updateFx(dt);
    if (G.screen === 'title') titleAmbience(dt);
    if (G.screen === 'play') { liveStars(); advanceHint(); }
    if (G.winAt > 0 && G.time >= G.winAt) { G.winAt = -1; if (G.screen === 'stryk') showStrykWin(); else showWin(); }
    if (G.screen === 'stryk' && G.sk) R.drawStryk(G.sk, { time: G.time, particles: G.particles, boatFx: G.skFx });
    else R.draw({
      world: G.world, time: G.time,
      particles: G.particles, fish: G.fish, leaves: G.leaves,
      boatFx: G.boatFx, dockFx: G.dockFx,
      look: G.look, aim: G.aim, hint: G.hint, light: save.light,
    });
    if (G.handOn) positionHand();
    requestAnimationFrame(frame);
  }

  function handleEvents() {
    const w = G.world;
    for (const ev of w.events) {
      switch (ev.type) {
        case 'tap':
          splash(ev.x, ev.y);
          S.plip(ev.x / C.W);
          G.look = { x: ev.x, y: ev.y, until: G.time + 2.5 };
          break;
        case 'hit': {
          const f = G.boatFx[ev.id];
          if (f) f.squash = 1;
          S.hit(ev.f);
          break;
        }
        case 'bump': bumpFx(ev); S.bump(ev.v, ev.what); break;
        case 'dock': dockFx(ev); S.dock(ev.n); break;
        case 'complete': if (G.screen === 'play' && w === G.world && G.entry) onComplete(); break;
        case 'sink': sinkFx(ev); S.sink(); break;
        case 'crash': crashFx(ev); S.crash(); break;
        case 'fall': fallFx(ev); S.fall(); break;
        case 'respawn': respawnFx(ev); S.pop(); break;
        case 'drop': dropFx(ev); S.drop(ev.x / C.W); break;
        case 'tide': S.tide(); break;
        case 'frog': S.frog(); break;
        case 'land': splash(ev.x, ev.y); S.land(); break;
        case 'switch': switchFx(ev); if (ev.opened) S.gate(); break;
      }
    }
    w.events.length = 0;
  }

  /* ---------- effekter ---------- */
  function addP(p) { p.t = 0; G.particles.push(p); if (G.particles.length > 420) G.particles.shift(); }

  function splash(x, y) {
    addP({ type: 'flash', x, y, size: 24, life: 0.42 });
    for (let i = 0; i < 11; i++) {
      const a = Math.random() * TAU, sp = 40 + Math.random() * 95;
      addP({ type: 'drop', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, drag: 4.5, size: 1.1 + Math.random() * 1.5, life: 0.32 + Math.random() * 0.28 });
    }
  }
  function bumpFx(ev) {
    const k = Math.min(1, ev.v / 300);
    for (let i = 0; i < 2 + k * 7; i++) {
      const a = Math.random() * TAU, sp = 20 + Math.random() * 60 * k;
      addP({ type: 'drop', x: ev.x, y: ev.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, drag: 5, size: 1 + Math.random(), life: 0.3 + Math.random() * 0.2 });
    }
    for (const b of G.world.boats) {
      if (Math.hypot(b.x - ev.x, b.y - ev.y) < b.r + 6) { const f = G.boatFx[b.id]; if (f) f.squash = Math.max(f.squash, 0.6 * k); }
    }
  }
  function dockFx(ev) {
    G.dockFx[ev.dock] = { flash: 1 };
    const f = G.boatFx[ev.id]; if (f) f.pop = 1;
    addP({ type: 'ringfx', x: ev.x, y: ev.y, r0: 20, size: 34, life: 0.7 });
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * TAU + Math.random() * 0.3, sp = 50 + Math.random() * 70;
      addP({ type: 'spark', x: ev.x, y: ev.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, drag: 3, size: 2.5 + Math.random() * 2.5, angle: Math.random() * 3, life: 0.6 + Math.random() * 0.4 });
    }
  }
  function sinkFx(ev) {
    for (let i = 0; i < 14; i++) {
      addP({ type: 'bubble', layer: 'under', x: ev.x + (Math.random() - 0.5) * 16, y: ev.y + (Math.random() - 0.5) * 16, vx: 0, vy: 0, size: 1.5 + Math.random() * 2.5, life: 0.4 + Math.random() * 0.9 });
    }
  }
  function crashFx(ev) {
    for (let i = 0; i < 18; i++) {
      const a = Math.random() * TAU, sp = 40 + Math.random() * 90;
      addP({ type: 'drop', x: ev.x, y: ev.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, drag: 4, size: 1.2 + Math.random() * 1.6, life: 0.4 + Math.random() * 0.3 });
    }
    const f = G.boatFx[ev.id]; if (f) f.squash = 1;
  }
  function fallFx(ev) {
    addP({ type: 'ringfx', x: ev.x + ev.nx * 10, y: ev.y + ev.ny * 10, r0: 6, size: 24, life: 0.5, rgb: '255,255,255' });
    for (let i = 0; i < 10; i++) {
      const a = Math.atan2(ev.ny, ev.nx) + (Math.random() - 0.5) * 2.4, sp = 30 + Math.random() * 70;
      addP({ type: 'drop', x: ev.x, y: ev.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, drag: 4.5, size: 1 + Math.random() * 1.4, life: 0.3 + Math.random() * 0.3 });
    }
    const f = G.boatFx[ev.id]; if (f) f.squash = 0.8;
  }
  function dropFx(ev) {
    addP({ type: 'flash', x: ev.x, y: ev.y, size: 14, life: 0.35 });
    for (let i = 0; i < 6; i++) {
      const a = Math.random() * TAU, sp = 30 + Math.random() * 50;
      addP({ type: 'drop', x: ev.x, y: ev.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, drag: 5, size: 0.9 + Math.random(), life: 0.25 + Math.random() * 0.2 });
    }
  }
  function switchFx(ev) {
    addP({ type: 'ringfx', x: ev.x, y: ev.y, r0: 10, size: 30, life: 0.6 });
    const g = G.world.gates[ev.gate];
    if (g && ev.opened) {
      for (let i = 0; i < 12; i++) {
        const u = i / 11, x = g.x1 + (g.x2 - g.x1) * u, y = g.y1 + (g.y2 - g.y1) * u;
        addP({ type: 'drop', x, y, vx: (Math.random() - 0.5) * 50, vy: (Math.random() - 0.5) * 50, drag: 4, size: 1 + Math.random() * 1.3, life: 0.4 + Math.random() * 0.3 });
      }
    }
  }
  function respawnFx(ev) {
    addP({ type: 'ringfx', x: ev.x, y: ev.y, r0: 6, size: 30, life: 0.5, rgb: '255,255,255' });
    const f = G.boatFx[ev.id]; if (f) f.pop = 1;
  }
  function confetti() {
    const cols = R.PAL.boats.map((p) => p[0]).concat(['#ffffff', '#ffe08a']);
    for (let i = 0; i < 60; i++) {
      addP({
        type: 'paper', x: Math.random() * C.W, y: -20 - Math.random() * 140,
        vx: (Math.random() - 0.5) * 40, vy: 60 + Math.random() * 60, grav: 30, drag: 0.4,
        size: 3 + Math.random() * 3, color: cols[i % cols.length], angle: Math.random() * TAU,
        spin: (Math.random() - 0.5) * 6, flip: 4 + Math.random() * 6, life: 3 + Math.random() * 1.5,
      });
    }
  }

  function updateFx(dt) {
    const ps = G.particles;
    for (let i = ps.length - 1; i >= 0; i--) {
      const p = ps[i];
      p.t += dt;
      if (p.t >= p.life) { ps.splice(i, 1); continue; }
      if (p.vx != null) {
        const k = Math.exp(-(p.drag || 0) * dt);
        p.vx *= k; p.vy *= k;
        if (p.grav) p.vy += p.grav * dt;
        if (p.type === 'paper') p.vx += Math.sin(p.t * 3 + p.angle) * 20 * dt;
        p.x += p.vx * dt; p.y += p.vy * dt;
      }
    }
    const w = G.world;
    if (w) {
      for (const b of w.boats) {
        const f = G.boatFx[b.id];
        if (!f) continue;
        f.squash = Math.max(0, f.squash - dt * 3.2);
        f.pop = Math.max(0, f.pop - dt * 2.6);
        f.nextBlink -= dt;
        if (f.nextBlink <= 0) { f.blink = 0.13; f.nextBlink = 2 + Math.random() * 4; }
        f.blink = Math.max(0, f.blink - dt);
        const sp = Math.hypot(b.vx, b.vy);
        let target = null;
        if (b.dock >= 0) target = w.docks[b.dock].angle;
        else if (sp > 25) target = Math.atan2(b.vy, b.vx);
        if (target != null) {
          let d = target - f.angle;
          d = Math.atan2(Math.sin(d), Math.cos(d));
          f.angle += d * Math.min(1, dt * (b.dock >= 0 ? 5 : 7));
        }
        if (sp > 55 && b.dock < 0 && b.sink <= 0) {
          f.wake += dt;
          if (f.wake > 0.035) {
            f.wake = 0;
            addP({ type: 'wake', layer: 'under', x: b.x - Math.cos(f.angle) * 12, y: b.y - Math.sin(f.angle) * 12, size: 5 + sp / 90, angle: f.angle, life: 0.8 });
          }
        }
      }
      for (const k in G.dockFx) G.dockFx[k].flash = Math.max(0, G.dockFx[k].flash - dt * 1.6);
      updateFish(dt, w);
      updateLeaves(dt, w);
    }
    if (G.look && G.time > G.look.until) G.look = null;
  }

  /* ---------- liv i dammen: fisk og blader ---------- */
  function seeded(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; };
  }
  function spawnDecor(id) {
    const rnd = seeded(String(id));
    G.fish = [];
    for (let i = 0; i < 4; i++) {
      G.fish.push({ x: 40 + rnd() * 280, y: 60 + rnd() * 480, angle: rnd() * TAU, speed: 13 + rnd() * 9, size: 6.5 + rnd() * 4, phase: rnd() * 10, dart: 0, hit: {}, wander: rnd() * 10 });
    }
    G.leaves = [];
    const w = G.world;
    const cols = ['#e9a23b', '#d9663a', '#a6cf5f', '#f2c14e'];
    for (let i = 0; i < 3; i++) {
      let x = 0, y = 0;
      for (let tries = 0; tries < 30; tries++) {
        x = 30 + rnd() * 300; y = 40 + rnd() * 520;
        let ok = true;
        for (const b of w.bodies) if (Math.hypot(b.x - x, b.y - y) < b.r + 24) ok = false;
        for (const d of w.docks) if (Math.hypot(d.x - x, d.y - y) < d.r + 20) ok = false;
        for (const r of w.rocks) if (Math.hypot(r.x - x, r.y - y) < r.r + 16) ok = false;
        if (ok) break;
      }
      G.leaves.push({ x, y, vx: 0, vy: 0, angle: rnd() * TAU, spin: 0, size: 5.5 + rnd() * 2.5, color: cols[i % cols.length], hit: {} });
    }
  }

  function updateFish(dt, w) {
    for (const f of G.fish) {
      f.wander += dt;
      f.angle += Math.sin(f.wander * 0.7 + f.phase) * 0.9 * dt;
      // hold deg unna kanten
      const m = 40;
      if (f.x < m || f.x > C.W - m || f.y < m || f.y > C.H - m) {
        const a = Math.atan2(C.H / 2 - f.y, C.W / 2 - f.x);
        let d = a - f.angle; d = Math.atan2(Math.sin(d), Math.cos(d));
        f.angle += d * Math.min(1, dt * 2.5);
      }
      // skvett unna krusninger
      for (const rp of w.ripples) {
        if (f.hit[rp.id]) continue;
        const d = Math.hypot(f.x - rp.x, f.y - rp.y);
        if (rp.r >= d - 10) {
          f.hit[rp.id] = true;
          if (E.falloff(d) > 0.06) { f.dart = 1; f.angle = Math.atan2(f.y - rp.y, f.x - rp.x) + (Math.random() - 0.5) * 0.6; }
        }
      }
      f.dart = Math.max(0, f.dart - dt * 1.4);
      const sp = f.speed + f.dart * f.dart * 170;
      f.x += Math.cos(f.angle) * sp * dt;
      f.y += Math.sin(f.angle) * sp * dt;
      f.x = Math.max(8, Math.min(C.W - 8, f.x)); f.y = Math.max(8, Math.min(C.H - 8, f.y));
    }
  }

  function updateLeaves(dt, w) {
    for (const l of G.leaves) {
      for (const rp of w.ripples) {
        if (l.hit[rp.id]) continue;
        const d = Math.hypot(l.x - rp.x, l.y - rp.y);
        if (rp.r >= d - 4) {
          l.hit[rp.id] = true;
          const f = E.falloff(d);
          if (f > 0 && d > 0.01) { l.vx += ((l.x - rp.x) / d) * 150 * f; l.vy += ((l.y - rp.y) / d) * 150 * f; l.spin += (Math.random() - 0.5) * 6 * f; }
        }
      }
      const k = Math.exp(-1.4 * dt);
      l.vx *= k; l.vy *= k; l.spin *= k;
      l.x += l.vx * dt; l.y += l.vy * dt; l.angle += l.spin * dt;
      if (l.x < 8) { l.x = 8; l.vx = Math.abs(l.vx) * 0.5; }
      if (l.x > C.W - 8) { l.x = C.W - 8; l.vx = -Math.abs(l.vx) * 0.5; }
      if (l.y < 8) { l.y = 8; l.vy = Math.abs(l.vy) * 0.5; }
      if (l.y > C.H - 8) { l.y = C.H - 8; l.vy = -Math.abs(l.vy) * 0.5; }
    }
  }

  // På tittelskjermen hopper en fisk av og til, så båtene driver litt.
  function titleAmbience(dt) {
    G.nextAmbient -= dt;
    if (G.nextAmbient > 0) return;
    G.nextAmbient = 5 + Math.random() * 4;
    const w = G.world;
    for (let tries = 0; tries < 12; tries++) {
      const x = 40 + Math.random() * 280, y = 120 + Math.random() * 360;
      if (w.bodies.every((b) => Math.hypot(b.x - x, b.y - y) > 130)) { E.tap(w, x, y); break; }
    }
  }

  /* ---------- toppmeny, tips og hånd ---------- */
  function updateHud() {
    if (!G.entry || !G.world) return;
    const lv = G.entry.lv;
    $('hudId').textContent = entryLabel(G.entry);
    $('hudName').textContent = I.pick(lv.name);
    $('hudTaps').textContent = G.world.taps;
    $('hudPar').textContent = t('par') + ' ' + lv.par;
    paintHudStars(G.shownStars, -1);
  }

  function paintHudStars(n, lostIdx) {
    const stars = $('hudStars').children;
    for (let i = 0; i < 3; i++) {
      stars[i].classList.toggle('off', i >= n);
      if (i === lostIdx) { stars[i].classList.remove('lost'); void stars[i].getBoundingClientRect(); stars[i].classList.add('lost'); }
    }
  }

  // Viser hvor mange stjerner som fortsatt er mulig.
  function liveStars() {
    if (!G.world || !G.entry) return;
    const w = G.world, lv = G.entry.lv;
    if (+$('hudTaps').textContent !== w.taps) $('hudTaps').textContent = w.taps;
    const possible = G.completed ? starsFor(lv, w.taps) : starsFor(lv, E.isSettled(w) ? w.taps + 1 : w.taps);
    if (possible !== G.shownStars) {
      const lost = possible < G.shownStars ? possible : -1;
      if (lost >= 0 && !G.completed) S.lose();
      G.shownStars = possible;
      paintHudStars(possible, lost);
    }
    $('btnRestart').classList.toggle('nudge', !G.completed && possible < 3);
  }

  function showBanner(lv, id) {
    const b = $('banner');

  /* ---------- bane fullført ---------- */
  function onComplete() {
    G.completed = true;
    G.aim = null; G.hint = null;
    const lv = G.entry.lv, taps = G.world.taps;
    const stars = starsFor(lv, taps);
    const pearl = taps <= lv.pearl && !G.hintUsed;
    if (G.entry.mode) {
      G.result = recordMode(G.entry, taps, stars, pearl);
      G.winAt = G.time + 1.05;
      hideTip(true);
      setTimeout(() => { if (G.completed) { S.win(); confetti(); } }, 350);
      return;
    }
    const prev = rec(lv.id) ? Object.assign({}, rec(lv.id)) : null;
    const starsBefore = totalStars();
    G.openBefore = LV.WORLDS.map(worldOpen);
    const r = save.levels[lv.id] || (save.levels[lv.id] = { best: taps, stars: 0, pearl: false, plays: 0 });
    r.best = Math.min(r.best, taps);
    r.stars = Math.max(r.stars, stars);
    r.pearl = !!(r.pearl || pearl);
    r.plays = (r.plays || 0) + 1;
    persist();
    G.result = { stars, pearl, taps, prev, rec: r, firstPearl: pearl && !(prev && prev.pearl), newBest: !!prev && taps < prev.best, starsBefore };
    G.winAt = G.time + 1.05;
    hideTip(true);
    setTimeout(() => { if (G.completed) { S.win(); confetti(); } }, 350);
  }

    if (!G.entry.mode && G.openBefore) {

  function goNext() {

    // slutten av verdenen: vis neste verden på kartet
    transition(() => {
      openMap(Math.min(LV.WORLDS.length - 1, e.wi + 1));

  /* ---------- Rask runde og Dagens dam ---------- */
  // Brettene lages av js/gen.js fra frø i js/pool.js (testet på forhånd med tools/gen.js).
  const PO = window.Pool, GEN = window.Gen;
  const TIER_NEED = { easy: null, medium: '1-10', hard: '2-1' }; // mekanikkene må være møtt på Stien
  const tierOpen = (tr) => !TIER_NEED[tr] || !!rec(TIER_NEED[tr]);
  const pad2 = (n) => String(n).padStart(2, '0');

  function entryLabel(e) {
    if (e.mode === 'quick') return t('tier_' + e.tier);
    if (e.mode === 'daily') return '#' + e.num;
    return e.lv.id;
  }

  function quickEntry(tr) {
    const list = PO.quick[tr], q = save.quick[tr];
    const lv = GEN.fromPool(list[q.i % list.length], tr);
    return { lv, mode: 'quick', tier: tr, wi: 0, idx: -1, done: false, stars: 0, pearl: false, prevStreak: 0 };
  }

  // Datoer som tekst 'ÅÅÅÅ-MM-DD' i lokal tid. Dagnummer telles fra Pool.daily.start.
  function todayKey() {
    if (G.fakeToday) return G.fakeToday; // brukes av testene
    const d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function keyUTC(key) { const p = key.split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2]); }
  function keyAdd(key, n) {
    const d = new Date(keyUTC(key) + n * 86400000);
    return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate());
  }
  function dayNum(key) { return Math.round((keyUTC(key) - keyUTC(PO.daily.start)) / 86400000); }
  function weekday(key) { return new Date(keyUTC(key)).getUTCDay(); }

  function dailyEntry(key) {
    const n = Math.max(0, dayNum(key));
    const days = PO.daily.days;
    const row = days[n % days.length]; // [frø, nivå, par, perle]
    const lv = GEN.fromPool([row[0], row[2], row[3]], row[1], { noCurrent: true });
    lv.id = 'D' + (n + 1);
    return { lv, mode: 'daily', tier: row[1], day: key, num: n + 1, wi: 0, idx: -1 };
  }
  function dailyStreak() {
    let k = todayKey();
    if (!save.daily[k]) k = keyAdd(k, -1);
    let n = 0;
    while (save.daily[k]) { n++; k = keyAdd(k, -1); }
    return n;
  }

  // Lagrer resultatet i Rask runde / Dagens dam og lager data til resultatkortet.
  function recordMode(e, taps, stars, pearl) {
    if (e.mode === 'quick') {
      const q = save.quick[e.tier];
      const firstPearl = pearl && !e.pearl;
      if (!e.done) { e.done = true; e.prevStreak = q.streak; q.i++; q.played++; }
      if (stars === 3 && e.stars < 3) { q.three++; q.streak = e.prevStreak + 1; q.best = Math.max(q.best, q.streak); }
      else if (e.stars < 3 && stars < 3) q.streak = 0;
      if (firstPearl) q.pearls++;
      e.stars = Math.max(e.stars, stars); e.pearl = e.pearl || pearl;
      persist();
      return { stars, pearl, taps, rec: { pearl: e.pearl }, firstPearl, newBest: false, starsBefore: totalStars() };
    }
    const prev = save.daily[e.day];
    const r = save.daily[e.day] = prev ? Object.assign({}, prev) : { best: taps, stars: 0, pearl: false, n: e.num };
    r.best = Math.min(r.best, taps);
    r.stars = Math.max(r.stars, stars);
    r.pearl = !!(r.pearl || pearl);
    persist();
    return { stars, pearl, taps, rec: r, firstPearl: pearl && !(prev && prev.pearl), newBest: !!prev && taps < prev.best, starsBefore: totalStars() };
  }

  function startDaily(key) {
    $('daily').hidden = true;
    transition(() => startLevel(dailyEntry(key)));
  }

  // Tilbake til tittelskjermen med riktig kort åpent.
  function leaveMode() {
    const mode = G.entry.mode;
    transition(() => { toTitle(); if (mode === 'quick') openQuick(); else openDaily(); });
  }

  function starText(n, pearl) { return '★'.repeat(n) + '☆'.repeat(3 - n) + (pearl ? ' ◉' : ''); }

  function shareDaily(key) {
    const r = save.daily[key];
    if (!r) return;
    const txt = t('shareText', { n: dailyEntry(key).num, used: I.ripples(r.best), stars: starText(r.stars, r.pearl) });
    const copy = () => {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(() => toast(t('copied')), () => toast(txt));
      } else toast(txt);
    };
    if (navigator.share) navigator.share({ text: txt }).catch((err) => { if (!err || err.name !== 'AbortError') copy(); });
    else copy();
  }

  function openDaily() { renderDaily(); $('daily').hidden = false; }
  function renderDaily() {
    const key = todayKey(), e = dailyEntry(key), r = save.daily[key];
    $('dailyTitle').textContent = t('daily');
    $('dailySub').textContent = '#' + e.num + ' · ' + t('wd' + weekday(key)) + ' · ' + t('tier_' + e.tier);
    // kalender: fire uker, mandag først, denne uka nederst
    const first = keyAdd(key, -((weekday(key) + 6) % 7) - 21);
    let h = t('wdShort').split(',').map((d) => `<b>${d}</b>`).join('');
    for (let i = 0; i < 28; i++) {
      const k = keyAdd(first, i), d = save.daily[k];
      const cls = ['cal-day'];
      if (keyUTC(k) > keyUTC(key)) cls.push('future');
      else if (dayNum(k) < 0) cls.push('before');
      if (k === key) cls.push('today');
      if (d) cls.push('done', 's' + d.stars);
      h += `<span class="${cls.join(' ')}">${+k.slice(8)}${d && d.pearl ? '<i class="pearl"></i>' : ''}</span>`;
    }
    $('dailyCal').innerHTML = h;
    const st = dailyStreak();
    $('dailyStreak').textContent = st === 0 ? t('streakNone') : st === 1 ? t('streakDay1') : t('streakDays', { n: st });
    $('dailyResult').hidden = !r;
    if (r) $('dailyResult').textContent = t('dailyDone', { used: I.ripples(r.best), stars: starText(r.stars, r.pearl) });
    $('btnDailyShare').hidden = !r;
    $('btnDailyShareTxt').textContent = t('share');
    $('btnDailyPlayTxt').textContent = r ? t('dailyAgain') : t('dailyPlay');
  }

  function openQuick() { renderQuick(); $('quick').hidden = false; }
  function renderQuick() {
    $('quickTitle').textContent = t('quick');
    $('quickSub').textContent = t('quickSub');
    const box = $('quickTiers');
    box.innerHTML = '';
    TIERS.forEach((tr, ti) => {

      const sub = !ok ? t('quickNeed', { id: TIER_NEED[tr] })
        : q.played ? t('quickStats', { n: q.played, s: q.streak, b: q.best }) : t('quickNew');
      b.innerHTML = `<span class="tier-dots">${dots}</span><span class="tier-text"><b>${t('tier_' + tr)}</b><span>${sub}</span></span>`;
      b.addEventListener('click', () => {
        S.click();

        $('quick').hidden = true;

      });

  /* ---------- Stryket (elvestryk) ---------- */
  // Egen modus: elva renner av seg selv, og båten styres med krusninger.
  // Simuleringen og banene ligger i stryket.js, tegningen i render.js.
  const SK = window.Stryket;
  const strykRec = (id) => save.stryk[id];
  const strykOpen = (i) => i === 0 || !!strykRec(SK.LEVELS[i - 1].id) || DEV_JUMP;

  function openStryk() { renderStryk(); $('stryk').hidden = false; }
  function renderStryk() {
    $('strykTitle').textContent = t('strykWorld');
    $('strykSub').textContent = t('strykSub');
    const box = $('strykList');
    box.innerHTML = '';
    SK.LEVELS.forEach((lv, i) => {
      const r = strykRec(lv.id), ok = strykOpen(i);
      const b = document.createElement('button');
      b.className = 'tier-btn stryk-lvl' + (ok ? '' : ' locked');
      const sub = !ok ? t('strykNeed', { id: SK.LEVELS[i - 1].id })
        : r ? t('strykStats', { p: r.pearls, n: lv.pearls.length }) : t('strykNew');
      b.innerHTML = `<span class="tier-dots">${starRow(r ? r.stars : 0)}</span><span class="tier-text"><b>${lv.id} · ${I.pick(lv.name)}</b><span>${sub}</span></span>`;
      b.addEventListener('click', () => {
        S.click();
        if (!ok) { toast(sub); return; }
        $('stryk').hidden = true;
        transition(() => startStryk(i));
      });
      box.appendChild(b);
    });
  }

  function startStryk(i, again) {
    const lv = SK.LEVELS[i];
    G.skI = i;
    G.sk = SK.create(lv);
    G.world = null; G.entry = null;
    G.particles = []; G.acc = 0;
    G.completed = false; G.winAt = -1; G.result = null;
    G.skFx = { squash: 0, blink: 0, nextBlink: 2, angle: -Math.PI / 2, pop: again ? 1 : 0, wake: 0 };
    G.shownStars = 3;
    setScreen('stryk');
    strykHud(true);
    paintHudStars(3, -1);
    $('btnRestart').classList.remove('nudge');
    if (!again) showBanner(lv, lv.id);
    // tips første gang (forsvinner ved første trykk)
    hideTip(true);
    if (lv.tip && !strykRec(lv.id)) {
      clearTimeout(showTip.tm);
      showTip.tm = setTimeout(() => {
        if (G.screen !== 'stryk' || G.sk.lv !== lv || G.sk.taps > 0) return;
        $('tipText').textContent = I.pick(lv.tip);
        $('tip').classList.remove('out');
        $('tip').hidden = false;
        G.tipOn = true;
      }, again ? 100 : 900);
    }
  }
  function restartStryk() { S.click(); startStryk(G.skI, true); }
  function leaveStryk() { transition(() => { toTitle(); openStryk(); }); }
  function strykNext() {
    S.click();
    const n = G.skI + 1;
    if (n < SK.LEVELS.length && strykOpen(n)) transition(() => startStryk(n));
    else leaveStryk();
  }

  function strykFrame(dt) {
    const st = G.sk;
    G.acc += dt;
    let n = 0;
    while (G.acc >= SK.K.DT && n < 10) {
      SK.step(st);
      G.acc -= SK.K.DT; n++;
      if (st.events.length) strykEvents();
    }
    if (n >= 10) G.acc = 0;
    // båten: blunk, klem og litt skrått når den glir sidelengs
    const f = G.skFx;
    f.squash = Math.max(0, f.squash - dt * 3.2);
    f.pop = Math.max(0, f.pop - dt * 2.6);
    f.nextBlink -= dt;
    if (f.nextBlink <= 0) { f.blink = 0.13; f.nextBlink = 2 + Math.random() * 4; }
    f.blink = Math.max(0, f.blink - dt);
    const target = -Math.PI / 2 + Math.max(-0.6, Math.min(0.6, st.vx * 0.0035));
    f.angle += (target - f.angle) * Math.min(1, dt * 8);
    // kjølvann bak båten som driver nedover med elva
    if (st.sink <= 0) {
      f.wake += dt;
      if (f.wake > 0.07) {
        f.wake = 0;
        const v = st.done ? 0 : SK.speedAt(st.lv, st.dist);
        addP({ type: 'wake', layer: 'under', x: st.x - Math.cos(f.angle) * 13, y: st.y - Math.sin(f.angle) * 13, vx: 0, vy: v, drag: 0, size: 5, angle: f.angle, life: 0.9 });
      }
    }
    if (G.tipOn && st.dist > 380) hideTip();
    strykHud(false);
  }

  function strykHud(all) {
    const st = G.sk, lv = st.lv;
    if (all) {
      $('hudId').textContent = lv.id;
      $('hudName').textContent = I.pick(lv.name);
    }
    $('hudProgFill').style.width = (SK.progress(st) * 100).toFixed(1) + '%';
    const pn = st.pearls + '/' + lv.pearls.length;
    if ($('hudPearlN').textContent !== pn) $('hudPearlN').textContent = pn;
    const stars = SK.starsFor(st.crashes);
    if (stars !== G.shownStars) {
      const lost = stars < G.shownStars ? stars : -1;
      if (lost >= 0) S.lose();
      G.shownStars = stars;
      paintHudStars(stars, lost);
      $('btnRestart').classList.toggle('nudge', stars < 3);
    }
  }

  function strykEvents() {
    const st = G.sk;
    for (const ev of st.events) {
      switch (ev.type) {
        case 'tap': splash(ev.x, ev.y); S.plip(ev.x / C.W); hideTip(); break;
        case 'hit': G.skFx.squash = Math.max(G.skFx.squash, 0.5 + ev.f * 0.5); S.hit(ev.f); break;
        case 'bump': bumpFx(ev); S.bump(ev.v, 'shore'); break;
        case 'crash':
          if (ev.why === 'whirl') { sinkFx(ev); S.sink(); } else { crashFx(ev); S.bump(400, ev.why === 'log' ? 'log' : 'rock'); S.crash(); }
          G.skFx.squash = 1;
          break;
        case 'respawn': respawnFx(ev); G.skFx.pop = 1; S.pop(); break;
        case 'pearl':
          addP({ type: 'ringfx', x: ev.x, y: ev.y, r0: 6, size: 26, life: 0.5, rgb: '255,250,255' });
          for (let i = 0; i < 8; i++) {
            const a = (i / 8) * TAU;
            addP({ type: 'spark', x: ev.x, y: ev.y, vx: Math.cos(a) * 70, vy: Math.sin(a) * 70, drag: 4, size: 4, angle: a, life: 0.5, color: '#fff' });
          }
          S.dock(Math.min(6, st.pearls - 1));
          break;
        case 'checkpoint': toast(t('strykCheck')); S.gate(); break;
        case 'complete': onStrykComplete(); break;
      }
    }
    st.events.length = 0;
  }

  /* ---------- hint (regnes ut fra situasjonen akkurat nå) ---------- */
  function requestHint() {
    if (!G.world || G.completed || G.screen !== 'play' || G.hintBusy) return;
    S.unlock(); S.click();
    if (!E.isSettled(G.world)) { toast(t('hintWait')); return; }
    if (!G.hintUsed) { G.hintUsed = true; toast(t('hintUsed')); }
    G.hintBusy = true;
    $('btnHint').classList.add('busy');
    const token = ++G.hintToken;
    findHint(G.world, token, (pt, cands) => {
      if (token !== G.hintToken) return;
      const show = (h) => {
        G.hintBusy = false;
        $('btnHint').classList.remove('busy');
        if (!h) { toast(t('hintNone')); return; }
        G.hint = h;
        hideTip();
      };
      if (!pt || !G.world.timber.length) { show(pt); return; }
      // tømmer: ta den første kandidaten som har et godt øyeblikk
      let i = 0;
      (function next() {
        timeHint(G.world, cands[i], token, (h) => {
          if (h) { show(h); return; }
          if (++i < cands.length) next();
          else show(pt);
        });
      })();
    });
  }

  // Tømmer i elva: når kan du trykke uten at båten treffer en stokk? Vi
  // prøver å vente 0–10 sekunder (hvert 0,05 s) og ser hvilke øyeblikk som
  // går fint. Hintet viser så et godt øyeblikk litt fram i tid.
  function timeHint(world, pt, token, cb) {
    const STEP = 6, K = 200, t0 = world.steps;
    const wait = E.clone(world);
    const ok = [];
    (function chunk() {
      if (token !== G.hintToken) return;
      const tt = performance.now();
      while (ok.length <= K && performance.now() - tt < 11) {
        const w = E.clone(wait);
        E.tap(w, pt.x, pt.y);
        let bad = false;
        for (let s = 0; s < 1100; s++) {
          E.step(w);
          if (w.events.some((e) => e.type === 'crash')) { bad = true; break; }
          w.events.length = 0;
          if (w.done) break;
          if ((s & 7) === 7 && E.isCalm(w)) break;
        }
        ok.push(!bad);
        for (let s = 0; s < STEP; s++) { E.step(wait); wait.events.length = 0; }
      }
      if (ok.length <= K) { requestAnimationFrame(chunk); return; }
      if (ok.every(Boolean)) { cb({ x: pt.x, y: pt.y }); return; } // her spiller timingen ingen rolle
      if (!ok.some(Boolean)) { cb(null); return; } // aldri et godt øyeblikk for dette trykket
      const wins = [];
      for (let i = 0; i < ok.length; i++) {
        if (!ok[i]) continue;
        let j = i;
        while (j + 1 < ok.length && ok[j + 1]) j++;
        wins.push([t0 + i * STEP, t0 + j * STEP]);
        i = j;
      }
      const h = { x: pt.x, y: pt.y, wins };
      nextWindow(h);
      cb(h.at != null ? h : null);
    })();
  }

  // Velg neste gode øyeblikk som er langt nok fram i tid til at du rekker å
  // se ringen. Helst et som gir minst ±0,12 s å gå på.
  function nextWindow(h) {
    h.at = null;
    const lead = G.world.steps + 84;
    let best = -1, bw = 2;
    for (let i = 0; i < h.wins.length; i++) {
      const [a, b] = h.wins[i];
      const at = Math.max((a + b) >> 1, lead);
      const win = Math.min(at - a, b - at);
      if (win >= 15) { best = i; break; }
      if (win > bw) { bw = win; best = i; }
    }
    if (best < 0) { h.wins.length = 0; return; }
    h.wins.splice(0, best);
    const [a, b] = h.wins[0];
    h.at = Math.max((a + b) >> 1, lead);
    h.win = Math.min(h.at - a, b - h.at);
  }

  // Gikk øyeblikket forbi uten at du trykket? Da viser vi det neste.
  function advanceHint() {
    const h = G.hint;
    if (!h || !h.wins || G.world.steps <= h.at + h.win) return;
    h.wins.shift();
    nextWindow(h);
    if (h.at == null) G.hint = null;
  }

  function hintScore(w) {
    let s = 0;
    for (const b of w.boats) {
      if (b.dock >= 0) { s += 1000; continue; }
      let best = 1e9;
      for (const d of w.docks) {
        if (d.boat >= 0 || (d.color >= 0 && d.color !== b.color)) continue;
        best = Math.min(best, E.pathDist(w, b.x, b.y, d.x, d.y));
      }
      s -= best;
      for (const v of w.whirls) if (Math.hypot(v.x - b.x, v.y - b.y) < v.r) s -= 150;
    }
    for (const sw of w.switches) if (sw.on) s += 250;
    return s;
  }


  function findHint(world, token, cb) {
    const base = E.clone(world);
    base.noTimber = true; // stokkene tas med etterpå, når vi finner riktig øyeblikk
    const movers = base.bodies.filter((b) => b.dock < 0);
    const reach = C.RIPPLE_RANGE - 12;
    const maxSteps = base.ice.length || base.winds.length ? 1100 : 760; // på is glir båtene lenge
    // bare trykk som faktisk når noe, i blandet rekkefølge (så vi kan stoppe tidlig)
    const pts = [];
    for (let y = 6; y < C.H; y += 11) {
      for (let x = 5; x < C.W; x += 11) {
        if (!E.insidePond(x, y, 8)) continue;
        if (!E.canTap(base, x, y)) continue;
        if (movers.some((b) => Math.hypot(b.x - x, b.y - y) < reach) || base.frogs.some((f) => Math.hypot(f.x - x, f.y - y) < reach)) pts.push([x, y]);
      }
    }
    const rnd = seeded('hint' + base.taps);
    for (let i = pts.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const tmp = pts[i]; pts[i] = pts[j]; pts[j] = tmp; }
    const res = [];
    let i = 0, wins = 0;
    const now = hintScore(base);
    (function chunk() {
      if (token !== G.hintToken) return;
      const t0 = performance.now();
      while (i < pts.length && performance.now() - t0 < 11) {
        const [x, y] = pts[i++];
        const w = E.clone(base);
        E.tap(w, x, y);
        let done = false;
        for (let s = 0; s < maxSteps; s++) {
          E.step(w); w.events.length = 0;
          if (w.done) { done = true; break; }
          if ((s & 7) === 7 && E.isCalm(w)) break;
        }
        if (done) wins++;
        res.push({ x, y, done, score: done ? 1e9 : hintScore(w) });
      }
      if (i < pts.length && wins < 40) { requestAnimationFrame(chunk); return; }
      // noen gode kandidater, de beste først (med tømmer prøver vi dem etter tur)
      const pick = (list) => {
        const out = [];
        for (const p of list) {
          if (out.every((q) => Math.hypot(p.x - q.x, p.y - q.y) > 20)) out.push({ x: p.x, y: p.y });
          if (out.length >= 6) break;
        }
        return out;
      };
      const winList = res.filter((r) => r.done);
      if (winList.length) {
        for (const p of winList) {
          let n = 0;
          for (const q of winList) if (Math.abs(p.x - q.x) <= 11 && Math.abs(p.y - q.y) <= 11) n++;
          p.n = n;
        }
        const c = pick(winList.slice().sort((a, b) => b.n - a.n));
        cb(c[0], c);
        return;
      }
      const c = pick(res.filter((r) => r.score > now + 8).sort((a, b) => b.score - a.score));
      if (c.length) { cb(c[0], c); return; }
      // Ingen enkelt trykk hjelper. Se to trykk fram: hvilket første trykk
      // gir det beste andre trykket?
      deepHint(base, pick(res.slice().sort((a, b) => b.score - a.score)), now, maxSteps, token, (pt) => cb(pt, pt ? [pt] : []));
    })();
  }

  function deepHint(base, first, now, maxSteps, token, cb) {
    const run = (from, x, y) => {
      const w = E.clone(from);
      E.tap(w, x, y);
      for (let s = 0; s < maxSteps; s++) {
        E.step(w); w.events.length = 0;
        if (w.done) break;
        if ((s & 7) === 7 && E.isCalm(w)) break;
      }
      return w;
    };
    let fi = 0, j = 0, state = null, pts = null, best = null, bestScore = -Infinity;
    (function chunk() {
      if (token !== G.hintToken) return;
      const t0 = performance.now();
      while (fi < first.length && bestScore < 1e9 && performance.now() - t0 < 11) {
        if (!state) {
          state = run(base, first[fi].x, first[fi].y);
          const movers = state.bodies.filter((b) => b.dock < 0);
          pts = [];
          for (let y = 8; y < C.H; y += 15) {
            for (let x = 8; x < C.W; x += 15) {
              if (E.insidePond(x, y, 8) && E.canTap(state, x, y) && movers.some((b) => Math.hypot(b.x - x, b.y - y) < C.RIPPLE_RANGE - 12)) pts.push([x, y]);
            }
          }
          j = 0;
          if (state.done) { best = first[fi]; bestScore = 1e9; break; }
        }
        while (j < pts.length && performance.now() - t0 < 11) {
          const [x, y] = pts[j++];
          const w = run(state, x, y);
          const sc = w.done ? 1e9 : hintScore(w);
          if (sc > bestScore) { bestScore = sc; best = first[fi]; }
          if (sc >= 1e9) break;
        }
        if (j >= pts.length || bestScore >= 1e9) { fi++; state = null; }
      }
      if (fi < first.length && bestScore < 1e9) { requestAnimationFrame(chunk); return; }
      cb(best && bestScore > now + 8 ? { x: best.x, y: best.y } : null);
    })();
  }

  function queueResize() { if (!resizeQueued) { resizeQueued = true; requestAnimationFrame(onResize); } }
  window.addEventListener('resize', queueResize);
  window.addEventListener('orientationchange', queueResize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', queueResize);

    onResize();
    G.titleWorld = E.createWorld(TITLE_LEVEL);
    toTitle();
    const d = data || {};
    if (d.screen === 'play' && d.level && byId(d.level) && levelOpen(byId(d.level))) startLevel(byId(d.level), true);
    else if (d.screen === 'map') openMap(d.map || 0);
    requestAnimationFrame((now) => { G.last = now; requestAnimationFrame(frame); });
  }

  // Når en ny versjon publiseres mens spillet er åpent, fortsetter vi der vi var.
  const hot = window.claude && window.claude.hot;
  try { if (hot && hot.snapshot) hot.snapshot(() => ({ screen: G.screen, level: G.entry && !G.entry.mode && G.entry.lv.id, map: G.mapWorld })); } catch (e) { /* ok */ }
  if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});

  // til testing i nettleserkonsollen
  window.Krusning = {
    G, startLevel: (id) => startLevel(byId(id)), save: () => save, playerTap, openMap,
    startQuick: (tr) => startLevel(quickEntry(tr)), startDaily: (key) => startLevel(dailyEntry(key || todayKey())),
    openDaily, openQuick, todayKey,
    startStryk: (i) => startStryk(i || 0), openStryk, sk: () => G.sk,
  };
})();

</script>
